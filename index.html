<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         BASIC SETTINGS
    ====================================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Asker Land Promotors - Land and property promotion services.">

    <meta name="author"
          content="Asker Land Promotors">

    <title>Asker Land Promotors</title>


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <!-- =====================================================
         HEADER / NAVBAR
    ====================================================== -->

    <header class="header">

        <nav class="navbar">

            <!-- Logo -->

            <a href="#home"
               class="logo">

                <img src="images/logo.png.jpeg"
                     alt="Asker Land Promotors Logo">

            </a>


            <!-- Navigation -->

            <ul class="nav-menu">

                <li>
                    <a href="#home">
                        Home
                    </a>
                </li>

                <li>
                    <a href="#about">
                        About
                    </a>
                </li>

                <li>
                    <a href="#services">
                        Services
                    </a>
                </li>

                <li>
                    <a href="#why-us">
                        Why Us
                    </a>
                </li>

                <li>
                    <a href="#contact">
                        Contact
                    </a>
                </li>

            </ul>


            <!-- WhatsApp -->

            <a href="#"
               id="nav-whatsapp"
               class="nav-whatsapp"
               target="_blank"
               rel="noopener">

                WhatsApp

            </a>


            <!-- Mobile Menu -->

            <button class="menu-toggle"
                    aria-label="Open navigation menu">

                ☰

            </button>

        </nav>

    </header>

    
      
    <!-- =====================================================
         MAIN WEBSITE
    ====================================================== -->

    <main>


        <!-- =================================================
             HOME / HERO
        ================================================== -->

        <section id="home"
                 class="hero">

            <div class="hero-overlay"></div>


            <div class="hero-content"
                 id="home-content">

                <!--
                    Content will be loaded from:

                    content/home.md
                -->

                <div class="content-loading">
                    Loading...
                </div>

            </div>

        </section>



        <!-- =================================================
             ABOUT
        ================================================== -->

        <section id="about"
                 class="about section">

            <div class="container">

                <div id="about-content">

                    <!--
                        Content loaded from:

                        content/about.md
                    -->

                    <div class="content-loading">
                        Loading...
                    </div>

                </div>

            </div>

        </section>



        <!-- =================================================
             SERVICES
        ================================================== -->

        <section id="services"
                 class="services section">

            <div class="container">

                <div id="services-content">

                    <!--
                        Content loaded from:

                        content/services.md
                    -->

                    <div class="content-loading">
                        Loading...
                    </div>

                </div>

            </div>

        </section>



        <!-- =================================================
             WHY US
        ================================================== -->

        <section id="why-us"
                 class="why-us section">

            <div class="container">

                <div id="why-us-content">

                    <!--
                        Content loaded from:

                        content/why-us.md
                    -->

                    <div class="content-loading">
                        Loading...
                    </div>

                </div>

            </div>

        </section>



        <!-- =================================================
             CALL TO ACTION
        ================================================== -->

        <section class="cta">

            <div class="container">

                <div id="cta-content">

                    <!--
                        CTA content can be controlled
                        from content/home.md
                    -->

                </div>

            </div>

        </section>



        <!-- =================================================
             CONTACT
        ================================================== -->

        <section id="contact"
                 class="contact section">

            <div class="container">

                <div id="contact-content">

                    <!--
                        Content loaded from:

                        content/contact.md
                    -->

                    <div class="content-loading">
                        Loading...
                    </div>

                </div>

            </div>

        </section>

    </main>
 


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">


        <!-- Footer Background -->

        <div class="footer-image"></div>


        <div class="footer-content">

            <div class="footer-container">


                <!-- Footer About -->

                <div class="footer-about">

                    <a href="#home"
                       class="footer-logo">

                        <img src="images/logo.png.jpeg"
                             alt="Asker Land Promotors Logo">

                    </a>


                    <div id="footer-description">

                        <!-- Loaded from content/contact.md -->

                    </div>

                </div>



                <!-- Quick Links -->

                <div class="footer-links">

                    <h3>
                        Quick Links
                    </h3>

                    <a href="#home">
                        Home
                    </a>

                    <a href="#about">
                        About
                    </a>

                    <a href="#services">
                        Services
                    </a>

                    <a href="#why-us">
                        Why Us
                    </a>

                    <a href="#contact">
                        Contact
                    </a>

                </div>



                <!-- Social Media -->

                <div class="footer-social">

                    <h3>
                        Follow Us
                    </h3>


                    <a href="https://www.instagram.com/asker_land_promotors"
                       id="instagram-link"
                       target="_blank"
                       rel="noopener">

                        Instagram

                    </a>


                    <a href="https://www.facebook.com/Asker Mobiles Udangudi"
                       id="facebook-link"
                       target="_blank"
                       rel="noopener">

                        Facebook

                    </a>

                </div>

            </div>



            <!-- Copyright -->

            <div class="footer-bottom">

                <p>

                    ©

                    <span id="current-year">
                        2026
                    </span>

                    Asker Land Promotors.
                    All Rights Reserved.

                </p>

            </div>

        </div>

    </footer>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>

</body>

</html>
